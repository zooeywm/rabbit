[package]
name = "rabbit"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
directories = "6.0"
# clap-compatible derive API with opposite (static-first) design goals.
palc = "0.0.2"
eros = "0.7"
compio = { version = "0.19", features = ["net", "quic", "ring", "time"] }
bytes = "1"
binrw = "0.15"
futures-core = "0.3"
futures-util = "0.3"
flume = { version = "0.12", default-features = false, features = ["async", "eventual-fairness"] }
thiserror = "2.0"
thin-cell = "0.2"
kudi = "0.1"
rcgen = "0.14"
tracing = "0.1"
tracing-subscriber = "0.3"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
slint = { version = "1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "raw-window-handle-06", "renderer-femtovg", "std"] }
socket2 = "0.6"

# Linux screen layout and KMS capture backends.
[target.'cfg(target_os = "linux")'.dependencies]
# niri-ipc does not guarantee Rust API compatibility across version updates.
drm = "0.15"
gbm = { version = "0.18", default-features = false }
glow = "0.18"
gstreamer = { version = "0.25", features = ["v1_24"] }
gstreamer-allocators = { version = "0.25", features = ["v1_24"] }
gstreamer-app = { version = "0.25", features = ["v1_24"] }
gstreamer-video = { version = "0.25", features = ["v1_24"] }
khronos-egl = { version = "6.0", features = ["dynamic"] }
niri-ipc = "26.4.0"
raw-window-handle = "0.6"
smithay-client-toolkit = { version = "0.20", default-features = false }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
